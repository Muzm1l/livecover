apiVersion: apps/v1
kind: Deployment
metadata:
  name: livecover-aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livecover-aggregator
  template:
    metadata:
      labels:
        app: livecover-aggregator
    spec:
      containers:
        - name: aggregator
          image: your-registry/livecover-aggregator:latest
          args: ["-config", "/etc/livecover/aggregator.hcl"]
          ports:
            - containerPort: 8080
            - containerPort: 9090
