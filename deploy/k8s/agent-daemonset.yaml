apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: livecover-agent
spec:
  selector:
    matchLabels:
      app: livecover-agent
  template:
    metadata:
      labels:
        app: livecover-agent
    spec:
      hostPID: true
      containers:
        - name: agent
          image: your-registry/livecover-agent:latest
          args: ["-config", "/etc/livecover/agent.hcl"]
          securityContext:
            privileged: true
